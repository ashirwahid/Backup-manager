# Build and deploy backend/ to Azure App Service (Linux Python 3.11).
# Oryx installs requirements-prod.txt on the server into antenv.

name: Build and deploy Python app to Azure Web App - backup-manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies for App Service
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt --target=".python_packages/lib/site-packages"
          chmod +x startup.sh

      # Upload backend/ with pre-built .python_packages (no pip on container boot).
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9904277AF8354557A071EA007094353F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BCB62555DA2B467EAB259C93DCCB61B5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7EE9661EF97B475F895D3364EBE17BBC }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: backup-manager-dxf7fbaah4e9dtd8
          slot-name: Production
